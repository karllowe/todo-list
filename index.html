<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
  <script defer src="main.js"></script></head>
  <body>
    <div class="mainDiv">
      <h1>Karl's todo app!</h1>
      <div id="toolBar">
        <div class="projectDiv">
          <h3>Project:</h3>
          <select name="project" id="projectSelect"></select>
          <button id="showNewProjectModal">+</button>
          <dialog id="newProjectModal">
            <button class="close">x</button>
            <h3>Add new project</h3>
            <div>
              <input type="text" id="newProjectName" />
              <button id="addNewProject">Add</button>
            </div>
          </dialog>
        </div>
        <div class="newTaskDiv">
          <input id="newTaskTitle" type="text" />
          <button id="createNew">Add</button>
        </div>
      </div>
      <ul class="toDoList"></ul>
      <dialog class="actionDetails">
        <div class="header">
          <h3>Action details:</h3>
          <button class="close">X</button>
        </div>
        <form action="">
          <div class="title">
            <label for="actionName">Title:</label>
            <input type="text" name="action_title" id="actionName" />
            <label for="state">State:</label>
            <select name="state" id="state">
              <option value="Open" selected>Open</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="row">
            <label for="dueDate">Due date:</label>
            <input type="date" name_due_date id="dueDate" />
            <label for="priority">Priority:</label>
            <select name="priority" id="priority">
              <option value="low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="row">
            <label for="description">Description:</label>
            <textarea name="description" id="description"></textarea>
          </div>
        </form>
      </dialog>
    </div>
  </body>
</html>
