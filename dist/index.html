<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo list</title>
<script defer src="main.js"></script></head>
<body>
    <h1>Karl's todo app!</h1>
    <div id="toolBar">
        <div class="projectDiv">
            <h3>Project:</h3>
            <select name="project" id="projectSelect"></select>
            <button id="showNewProjectModal">+</button>
            <dialog id="newProjectModal">
                <button class="close">x</button>
                <h3>Add new project</h3>
                <div>
                    <input type="text" id="newProjectName">
                    <button id="addNewProject">Add</button>
                </div>
            </dialog>
        </div>
        <div class="newTaskDiv">
            <input id="newTaskTitle" type="text">
            <button id="createNew">Add</button>
        </div>
    </div>
    <ul class="toDoList">
    </ul>
</body>
</html>
